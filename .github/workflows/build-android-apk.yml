name: Build Book-A-Boo Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android wrapper dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Prepare BAB app icon
        working-directory: android-app
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://book-a-boo-mu.vercel.app/icons/icon-512.png \
            --output assets/logo.png
          file assets/logo.png

      - name: Generate Android project
        working-directory: android-app
        run: npx cap add android

      - name: Generate BAB launcher and splash assets
        working-directory: android-app
        run: |
          npx capacitor-assets generate --android \
            --assetPath assets \
            --androidProject android \
            --iconBackgroundColor '#111014' \
            --iconBackgroundColorDark '#111014' \
            --splashBackgroundColor '#111014' \
            --splashBackgroundColorDark '#111014'

      - name: Sync Capacitor project
        working-directory: android-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: book-a-boo-android-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
