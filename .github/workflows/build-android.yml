name: Build Book-A-Boo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/build-android.yml"
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore permanent Android signing key
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.BAB_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BAB_ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_SHA256: ${{ secrets.BAB_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing BAB_ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing BAB_ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$EXPECTED_SHA256" || (echo "Missing BAB_ANDROID_CERT_SHA256 secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          ACTUAL_SHA256=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || (echo "Signing certificate fingerprint mismatch" && exit 1)
          echo "Permanent signing key restored and verified."

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BAB_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BAB_ANDROID_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Generate Digital Asset Links
        env:
          EXPECTED_SHA256: ${{ secrets.BAB_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.bookaboo.app",
                "sha256_cert_fingerprints": ["$EXPECTED_SHA256"]
              }
            }
          ]
          EOF

      - name: Publish Digital Asset Links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish permanent Android app verification"
            git push
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-A-Boo-Android-APK
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
