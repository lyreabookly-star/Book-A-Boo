name: Build Book-A-Boo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/build-android.yml"
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Prepare Android signing key
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.BAB_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BAB_ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_SHA256: ${{ secrets.BAB_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$EXPECTED_SHA256" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.keystore
            ACTUAL_SHA256=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '\r')
            test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || (echo "Signing certificate fingerprint mismatch" && exit 1)
            BAB_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            BAB_CERT_SHA256="$EXPECTED_SHA256"
            BAB_SIGNING_MODE="persistent"
            echo "Persistent signing key restored and verified."
          else
            echo "::warning::No permanent signing secrets configured. Generating a temporary beta key; future APK updates will require uninstalling the previous beta first."
            BAB_KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            keytool -genkeypair -noprompt -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BAB_KEYSTORE_PASSWORD" \
              -keypass "$BAB_KEYSTORE_PASSWORD" \
              -dname "CN=Book-A-Boo, OU=Android, O=Book-A-Boo, L=Abidjan, ST=Abidjan, C=CI"
            BAB_CERT_SHA256=$(keytool -list -v -keystore android.keystore -alias android -storepass "$BAB_KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '\r')
            BAB_SIGNING_MODE="temporary-beta"
          fi
          echo "BAB_KEYSTORE_PASSWORD=$BAB_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BAB_CERT_SHA256=$BAB_CERT_SHA256" >> "$GITHUB_ENV"
          echo "BAB_SIGNING_MODE=$BAB_SIGNING_MODE" >> "$GITHUB_ENV"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap Android toolchain
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.BAB_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.BAB_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --signingKeyPath=./android.keystore --signingKeyAlias=android

      - name: Generate Digital Asset Links
        env:
          EXPECTED_SHA256: ${{ env.BAB_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.bookaboo.app",
                "sha256_cert_fingerprints": ["$EXPECTED_SHA256"]
              }
            }
          ]
          EOF

      - name: Publish Digital Asset Links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android app verification fingerprint"
            git push
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p android-release
          cp android/app-release-signed.apk android-release/Book-A-Boo.apk
          cp public/.well-known/assetlinks.json android-release/assetlinks.json
          printf '%s\n' "$BAB_CERT_SHA256" > android-release/certificate-sha256.txt
          printf '%s\n' "$BAB_SIGNING_MODE" > android-release/signing-mode.txt
          if [ "$BAB_SIGNING_MODE" = "temporary-beta" ]; then
            printf '%s\n' "Beta build only. A later beta build may have a different signature; uninstall this beta before installing its replacement." > android-release/INSTALL-NOTES.txt
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-A-Boo-Android-APK
          path: android-release/
          if-no-files-found: error
          retention-days: 14
