<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Hors connexion · Book-A-Boo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#f7f6f2;color:#20201e;font-family:Arial,sans-serif}
    main{width:min(100%,460px);text-align:center;padding:42px 28px;border:1px solid #e6e3dc;background:#fbfaf7}
    img{width:66px;height:66px;object-fit:contain;margin-bottom:25px}p{color:#77756f;line-height:1.8;font-size:14px}
    h1{font-family:Georgia,serif;font-size:36px;font-weight:400;letter-spacing:-1.5px;margin:0 0 14px}h1 em{color:#a34f3e}
    button{margin-top:18px;border:0;background:#a34f3e;color:white;padding:14px 22px;font-size:13px;cursor:pointer}
    small{display:block;margin-top:26px;color:#99958c;font-size:10px;letter-spacing:1px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Book-A-Boo">
    <h1>Un petit détour<br><em>hors connexion.</em></h1>
    <p>Book-A-Boo n'arrive pas à se connecter pour le moment. Vérifie ta connexion internet puis réessaie. Tes données de compte ne sont pas stockées hors ligne.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <small>BOOK-A-BOO · CHAQUE HISTOIRE OUVRE UN MONDE</small>
  </main>
</body>
</html>
